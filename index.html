<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIWOOM K</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: #e8e6e0;
      --text-primary: #1a1a1a;
      --text-secondary: #888880;
      --text-muted: #b8b6b0;
      --accent: #1a1a1a;
      --sidebar-w: 56px;
      --topbar-h: 52px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    /* ── 사이드바 ── */
    .sidebar {
      width: var(--sidebar-w);
      height: 100vh;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 4px;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-logo {
      width: 32px;
      height: 32px;
      background: var(--text-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .sidebar-logo svg { width: 16px; height: 16px; fill: white; }

    .nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s ease;
      position: relative;
    }

    .nav-icon:hover { background: var(--bg); color: var(--text-primary); }
    .nav-icon.active { background: var(--text-primary); color: white; }

    .nav-icon svg { width: 16px; height: 16px; }

    .sidebar-divider {
      width: 24px;
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .sidebar-bottom { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }

    /* ── 메인 ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 탑바 ── */
    .topbar {
      height: var(--topbar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      flex-shrink: 0;
    }

    .topbar-brand {
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }

    .topbar-page {
      font-size: 13px;
      color: var(--text-muted);
    }

    .topbar-search {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 14px;
      height: 34px;
      width: 240px;
      transition: border-color 0.15s;
    }

    .topbar-search:focus-within { border-color: var(--text-primary); }

    .topbar-search input {
      background: none;
      border: none;
      outline: none;
      font-size: 13px;
      color: var(--text-primary);
      font-family: inherit;
      width: 100%;
    }

    .topbar-search input::placeholder { color: var(--text-muted); }

    .search-icon { color: var(--text-muted); flex-shrink: 0; }

    .topbar-actions { display: flex; align-items: center; gap: 8px; margin-left: 12px; }

    .topbar-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .topbar-btn:hover { border-color: var(--text-primary); color: var(--text-primary); }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--text-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    /* ── 콘텐츠 ── */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .content-title {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .content-date {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* ── 카드 그리드 ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 18px 18px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.18s;
    }

    .card:hover {
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .card-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .card-info { display: flex; flex-direction: column; gap: 3px; }

    .card-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 카드 색상 테마 */
    .theme-pink   .card-icon-wrap { background: #fce8ef; }
    .theme-blue   .card-icon-wrap { background: #e3eeff; }
    .theme-teal   .card-icon-wrap { background: #dff5ee; }
    .theme-amber  .card-icon-wrap { background: #fef3dc; }
    .theme-purple .card-icon-wrap { background: #eeecfd; }
    .theme-green  .card-icon-wrap { background: #e6f4e0; }
    .theme-coral  .card-icon-wrap { background: #fce9e4; }
    .theme-sky    .card-icon-wrap { background: #e0f2fb; }
    .theme-lime   .card-icon-wrap { background: #eef6da; }

    .theme-pink:hover   { background: #fce8ef; }
    .theme-blue:hover   { background: #e3eeff; }
    .theme-teal:hover   { background: #dff5ee; }
    .theme-amber:hover  { background: #fef3dc; }
    .theme-purple:hover { background: #eeecfd; }
    .theme-green:hover  { background: #e6f4e0; }
    .theme-coral:hover  { background: #fce9e4; }
    .theme-sky:hover    { background: #e0f2fb; }
    .theme-lime:hover   { background: #eef6da; }

    /* ── 스크롤바 ── */
    .content::-webkit-scrollbar { width: 4px; }
    .content::-webkit-scrollbar-track { background: transparent; }
    .content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── 페이지 진입 애니메이션 ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card {
      animation: fadeUp 0.3s ease both;
    }

    .card:nth-child(1)  { animation-delay: 0.04s; }
    .card:nth-child(2)  { animation-delay: 0.08s; }
    .card:nth-child(3)  { animation-delay: 0.12s; }
    .card:nth-child(4)  { animation-delay: 0.16s; }
    .card:nth-child(5)  { animation-delay: 0.20s; }
    .card:nth-child(6)  { animation-delay: 0.24s; }
    .card:nth-child(7)  { animation-delay: 0.28s; }
    .card:nth-child(8)  { animation-delay: 0.32s; }
    .card:nth-child(9)  { animation-delay: 0.36s; }
  </style>
</head>
<body>

<!-- 사이드바 -->
<div class="sidebar">

<div class="nav-icon" title="검색" onclick="window.location.href='product_search.html'" style="cursor:pointer;">

  <div class="sidebar-bottom">

</div>

<!-- 메인 -->
<div class="main">
  <!-- 탑바 -->
  <div class="topbar">
    <span class="topbar-brand">SIWOOM K</span>
    <span class="topbar-page">홈</span>

    <div class="topbar-search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="6.5" cy="6.5" r="4"/><line x1="10" y1="10" x2="14" y2="14"/>
      </svg>
      <input placeholder="Search 홈">
    </div>

    <div class="topbar-actions">
      <div class="topbar-btn" title="새로고침">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M13.5 8A5.5 5.5 0 112.5 5"/><path d="M2 2v3.5H5.5"/>
        </svg>
      </div>
      <div class="topbar-btn" title="필터">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="2" y1="4" x2="14" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="6" y1="12" x2="10" y2="12"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 콘텐츠 -->
  <div class="content">
    <div class="content-header">
      <div class="content-title">홈</div>
      <div class="content-date" id="today-date"></div>
    </div>

    <div class="grid">

      <div class="card theme-pink" onclick="handleCardClick('일정')">
        <div class="card-icon-wrap">📅</div>
        <div class="card-info">
          <div class="card-name">일정</div>
          <div class="card-desc">일정</div>
        </div>
      </div>

      <div class="card theme-blue" onclick="window.location.href='product_search.html'">
        <div class="card-icon-wrap">🔍</div>
        <div class="card-info">
          <div class="card-name">품목검색</div>
          <div class="card-desc">품목검색</div>
        </div>
      </div>

      <div class="card theme-blue" onclick="handleCardClick('POB 검색')">
        <div class="card-icon-wrap">❓</div>
        <div class="card-info">
          <div class="card-name">POB 검색</div>
          <div class="card-desc">POB 검색</div>
        </div>
      </div>

      <div class="card theme-teal" onclick="handleCardClick('판매주문')">
        <div class="card-icon-wrap">💲</div>
        <div class="card-info">
          <div class="card-name">판매주문</div>
          <div class="card-desc">판매목록</div>
        </div>
      </div>

      <div class="card theme-amber" onclick="handleCardClick('SKU')">
        <div class="card-icon-wrap">🏷️</div>
        <div class="card-info">
          <div class="card-name">SKU</div>
          <div class="card-desc">SKU</div>
        </div>
      </div>

      <div class="card theme-green" onclick="handleCardClick('송장내역확인')">
        <div class="card-icon-wrap">🧾</div>
        <div class="card-info">
          <div class="card-name">송장내역확인</div>
          <div class="card-desc">송장내역확인</div>
        </div>
      </div>

      <div class="card theme-amber" onclick="handleCardClick('재고')">
        <div class="card-icon-wrap">📦</div>
        <div class="card-info">
          <div class="card-name">재고</div>
          <div class="card-desc">재고</div>
        </div>
      </div>

      <div class="card theme-teal" onclick="handleCardClick('구매')">
        <div class="card-icon-wrap">🛒</div>
        <div class="card-info">
          <div class="card-name">구매</div>
          <div class="card-desc">구매</div>
        </div>
      </div>

      <div class="card theme-purple" onclick="handleCardClick('월차')">
        <div class="card-icon-wrap">🛏️</div>
        <div class="card-info">
          <div class="card-name">월차</div>
          <div class="card-desc">월차</div>
        </div>
      </div>

    </div>
  </div>
</div>

<script>  
  // 1. 현재 날짜 표시
  const d = new Date();
  const dateElement = document.getElementById('today-date');
  if (dateElement) {
    dateElement.textContent = d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }

  // 2. 구글 앱스 스크립트 로그 전송 함수
  async function sendLogToSheet(actionName) {
    const url = 'https://script.google.com/macros/s/AKfycbx4lcJb3De1len92Q1tx61ETbkGFD0mH0SSwIIlsBBDOAdTlyzdfxWjfIiz-_wfnf_t/exec';
    
    const data = {
      action: actionName,
      timestamp: new Date().toLocaleString(),
      user: 'R' 
    };

    try {
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors', // CORS 정책 우회
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      console.log(actionName + " 로그 기록 완료");
    } catch (error) {
      console.error("로그 전송 실패:", error);
    }
  }

  // 3. 카드 클릭 시 페이지 이동 및 로그 전송
  function handleCardClick(name) {
    // 먼저 로그를 전송합니다.
    sendLogToSheet(name); 

    // 클릭된 카드 이름에 따라 이동 경로 설정
    if (name === '품목검색') {
      // 1초 뒤 이동 (로그 전송 요청이 시작될 시간을 주기 위함)
      setTimeout(() => {
        window.location.href = 'product_search.html'; 
      }, 100);
    } else {
      // 그 외의 카드는 알림창만 표시
      alert(name + ' 페이지로 이동합니다. (준비 중)');
    }
  }
</script>
</body>
</html>
